# quip-android-aglais-node controller configuration

[node]
network = "aglais"
chain_id = "quip-testnet"
mode = "eco"
device_label = "Infinix-Note-G96"

[miner]
backend = "cpu"
workers = 1
max_runtime_minutes = 60
quip_miner_path = "auto"
extra_args = []
runtime_config_path = "data/quip-miner.runtime.toml"
node_name = "quip-android"
faucet_url = "https://faucet.aglais.quip.network"
cpu_binary = "quip-cpu-sa"
gpu_binary = "quip-cuda-sa"

[rpc]
endpoints = [
    "wss://bootnode-1.aglais.quip.network:20049/rpc",
    "wss://bootnode-2.aglais.quip.network:20049/rpc",
    "wss://bootnode-3.aglais.quip.network:20049/rpc"
]
timeout_seconds = 6.0
retry_interval_seconds = 10.0
require_chain_match = true

[signer]
key_path = "~/.quip-miner/signing.json"
require_existing = true

[safety]
max_memory_percent = 85.0
max_runtime_minutes = 120
max_cpu_workers = 2
max_temperature_c = 72.0
process_nice = 19

[participation]
provider = "miner_logs"
journal_path = "data/participation.jsonl"
daily_qblock_target = 10

[points]
public_p2p = false
public_api = false
tls = false
live_rpc = false
telemetry = false
dashboard = false

[dashboard]
enabled = true
host = "127.0.0.1"
port = 8080
